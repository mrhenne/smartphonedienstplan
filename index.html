<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dienstplan Pro - Helios Notaufnahme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDKs (Modular v11.6.1) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseCore = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, doc, setDoc, getDoc, collection, onSnapshot, serverTimestamp };
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020617;
            --text-primary: #ffffff; 
            --text-secondary: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --table-header-bg: #0f172a;
            --row-hover: rgba(255, 255, 255, 0.05);
            --separator-color: rgba(255, 255, 255, 0.08);
            --holiday-color: rgba(234, 179, 8, 0.35);
            --weekend-color: rgba(59, 130, 246, 0.15);
            --zoom-factor: 1;
        }

        .light-mode {
            --bg-color: #f8fafc;
            --text-primary: #0f172a; 
            --text-secondary: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.95); 
            --glass-border: rgba(0, 0, 0, 0.1);
            --table-header-bg: #ffffff;
            --row-hover: rgba(59, 130, 246, 0.05); 
            --separator-color: rgba(15, 23, 42, 0.08);
            --holiday-color: rgba(234, 179, 8, 0.25);
            --weekend-color: rgba(59, 130, 246, 0.08);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            overflow: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .glass { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); }
        .name-col-bg { background: var(--bg-color) !important; z-index: 50; }
        .sticky-left { position: sticky; left: 0; z-index: 40; }

        .holiday-cell { background-color: var(--holiday-color) !important; }
        .weekend-cell { background-color: var(--weekend-color) !important; }
        .warning-cell { background-color: rgba(225, 29, 72, 0.15) !important; }

        #rosterTable { zoom: var(--zoom-factor); transform-origin: top left; }

        @media print {
            @page { size: A3 landscape; margin: 10mm; }
            body { background: white !important; color: black !important; overflow: visible !important; }
            .no-print { display: none !important; }
            main { border: none !important; background: transparent !important; width: 100% !important; overflow: visible !important; }
            #tableContainer { overflow: visible !important; height: auto !important; }
            #rosterTable { zoom: 1 !important; width: 100% !important; border-collapse: collapse !important; border: 1px solid black !important; }
            thead { display: table-header-group !important; }
            tr { page-break-inside: avoid !important; }
            .name-col-bg { background: white !important; border-right: 1px solid black !important; }
            th, td { border: 0.5pt solid black !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; color: black !important; }
            .sticky-left { position: static !important; }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(120, 120, 120, 0.3); border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div id="toast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-[300] items-center">
        <div class="glass px-6 py-3 rounded-2xl shadow-2xl border border-white/20 flex items-center gap-3">
            <div id="toastIcon"></div>
            <span id="toastMessage" class="text-sm font-bold"></span>
        </div>
    </div>

    <!-- HEADER -->
    <header class="glass m-2 md:m-4 p-3 rounded-2xl shadow-2xl no-print flex items-center justify-between gap-4">
        <div class="flex items-center gap-3 shrink-0">
            <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-500 rounded-xl flex items-center justify-center">
                <i data-lucide="calendar" class="text-white" size="20"></i>
            </div>
            <div class="hidden sm:block">
                <h1 class="text-lg font-black tracking-tight leading-none mb-0.5">Dienstplan PRO</h1>
                <p class="text-[9px] text-slate-500 uppercase font-bold tracking-wider" id="syncLabel">Helios Duisburg</p>
            </div>
        </div>

        <div class="flex items-center gap-2 bg-black/5 p-1 rounded-2xl border border-white/5 ml-auto">
            <div class="flex items-center bg-black/20 rounded-xl p-0.5 border border-white/5 shrink-0 mr-1">
                <button id="viewMonthBtn" onclick="toggleViewMode('month')" class="px-3 py-1.5 rounded-lg text-[9px] font-black uppercase transition-all">Monat</button>
                <button id="viewWeekBtn" onclick="toggleViewMode('week')" class="px-3 py-1.5 rounded-lg text-[9px] font-black uppercase transition-all">Woche</button>
            </div>

            <div class="flex items-center bg-black/20 rounded-xl p-0.5 border border-white/5 shrink-0">
                <button onclick="handleNavigation(-1)" class="p-1.5 hover:bg-white/10 rounded-lg"><i data-lucide="chevron-left" size="14"></i></button>
                <div id="monthLabel" onclick="openYearModal()" class="px-3 font-black text-[11px] uppercase cursor-pointer min-w-[110px] text-center">Monat</div>
                <button onclick="handleNavigation(1)" class="p-1.5 hover:bg-white/10 rounded-lg"><i data-lucide="chevron-right" size="14"></i></button>
            </div>

            <div class="flex items-center gap-1 shrink-0 ml-2">
                <button onclick="openColumnModal()" class="p-2 hover:bg-white/10 rounded-xl text-slate-400" title="Einstellungen"><i data-lucide="settings-2" size="16"></i></button>
                <button onclick="exportToPDF()" class="px-3 py-2 bg-slate-700 text-white rounded-xl text-[11px] font-black shadow-lg flex items-center gap-2 transition-all active:scale-95">
                    <i data-lucide="file-down" size="14"></i><span class="hidden lg:inline">Export</span>
                </button>
                <button id="saveBtn" onclick="saveData()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-[11px] font-black shadow-lg flex items-center gap-2 transition-all active:scale-95">
                    <i data-lucide="save" id="saveIcon" size="14"></i><span class="hidden lg:inline">Sichern</span>
                </button>
            </div>
        </div>
    </header>

    <div class="hidden print:block mb-4 border-b-2 border-black pb-2 px-4">
        <h1 class="text-2xl font-bold uppercase">Dienstplan Helios Notaufnahme</h1>
        <p class="text-sm font-black" id="printMonthLabel"></p>
    </div>

    <div class="flex flex-1 overflow-hidden relative mb-20 md:mb-0">
        <aside class="fixed bottom-0 left-0 w-full z-[100] md:relative md:w-20 lg:w-48 p-2 md:p-0 no-print">
            <div class="glass p-3 md:p-4 rounded-t-3xl md:rounded-2xl h-full flex flex-row md:flex-col gap-2 overflow-x-auto no-scrollbar">
                <div id="shiftPalette" class="flex flex-row md:flex-col gap-2 items-center"></div>
            </div>
        </aside>

        <main class="flex-1 glass m-2 md:m-4 mt-0 rounded-2xl overflow-hidden flex flex-col shadow-2xl relative">
            <div class="overflow-x-auto overflow-y-auto flex-1 custom-scrollbar" id="tableContainer">
                <table class="w-full border-separate border-spacing-0" id="rosterTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                    <tfoot id="tableFoot" class="sticky bottom-0 z-40 bg-[var(--bg-color)]"></tfoot>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL CONTAINER (EINSTELLUNGEN) -->
    <div id="columnOverlay" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[200] items-center justify-center" onclick="closeColumnModal()">
        <div class="glass p-8 rounded-3xl w-96 shadow-2xl flex flex-col gap-4" onclick="event.stopPropagation()">
            <h3 class="text-lg font-bold text-center">Konfiguration</h3>
            <button onclick="loadCloudData()" class="w-full py-3 bg-blue-600/20 text-blue-400 rounded-xl text-[11px] font-black border border-blue-500/20 flex items-center justify-center gap-2">
                <i data-lucide="refresh-cw" size="14"></i> Cloud-Daten erzwingen
            </button>
            <button onclick="openShiftModal()" class="w-full py-3 bg-emerald-600/20 text-emerald-400 rounded-xl text-[11px] font-black border border-emerald-500/20 flex items-center justify-center gap-2">
                <i data-lucide="edit-3" size="14"></i> Dienste anpassen
            </button>
            <div class="border-t border-white/10 pt-4 mt-2">
                <p class="text-[10px] uppercase font-black text-slate-500 mb-2">Ansicht Zoom</p>
                <input type="range" id="zoomSlider" min="0.5" max="1.5" step="0.05" value="1" oninput="adjustZoom(0)" class="w-full accent-blue-600">
            </div>
            <button onclick="closeColumnModal()" class="w-full py-4 mt-4 bg-blue-600 text-white rounded-xl font-bold">Schließen</button>
        </div>
    </div>

    <!-- SHIFT MODAL -->
    <div id="shiftModalOverlay" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[250] items-center justify-center">
        <div class="glass p-8 rounded-3xl w-[500px] max-h-[90vh] shadow-2xl flex flex-col gap-6 overflow-hidden" onclick="event.stopPropagation()">
            <h3 class="text-lg font-black text-center flex items-center justify-center gap-2"><i data-lucide="list-plus"></i> Dienste</h3>
            <div class="overflow-y-auto custom-scrollbar pr-2 flex flex-col gap-3" id="shiftTypeListContainer"></div>
            <button onclick="closeShiftModal()" class="py-4 rounded-xl bg-blue-600 text-white font-bold">Speichern</button>
        </div>
    </div>

    <script>
        // --- State ---
        let db, auth, user;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'helios-duisburg-notaufnahme-v1';
        
        // Deine Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyD3HcZOIv6Wyg3_5xoBnSnz-Eb4fgLr0SA",
            authDomain: "dienstplanprogramm.firebaseapp.com",
            projectId: "dienstplanprogramm",
            storageBucket: "dienstplanprogramm.firebasestorage.app",
            messagingSenderId: "193664964493",
            appId: "1:193664964493:web:e99e822739cb13c8df0fc4"
        };

        const INITIAL_EMPLOYEES = [
            { id: '1', name: 'Adams, Hendrik', role: 'Stationsleitung', status: '100%' },
            { id: '2', name: 'Fuchsa, Jennifer', role: 'stellv. Leitung', status: '100%' },
            { id: '3', name: 'Günter, Stephanie', role: 'Pflegekraft', status: '100%' },
            { id: '4', name: 'Blank, Alexandra', role: 'Pflegekraft', status: '100%' },
            { id: '5', name: 'Friedrich, Kristina', role: 'Pflegekraft', status: '100%' },
            { id: '6', name: 'Weienberg, Hanna', role: 'Fachkraft', status: '100%' },
            { id: '7', name: 'Hackmann, Matthias', role: 'Pflegekraft', status: '90%' },
            { id: '8', name: 'Buchmüller, Jörg', role: 'Pflegekraft', status: '100%' },
            { id: '9', name: 'Rösken, Katrin', role: 'Pflegekraft', status: '100%' },
            { id: '10', name: 'Theißen, Jennifer', role: 'Pflegekraft', status: '100%' },
            { id: '11', name: 'Daniels, Justin', role: 'Pflegekraft', status: '100%' },
            { id: '12', name: 'Kaymaz, Melda', role: 'Pflegekraft', status: '100%' },
            { id: '13', name: 'Kühn, Philipp', role: 'Pflegekraft', status: '100%' },
            { id: '14', name: 'Strachanski, Julia', role: 'Pflegekraft', status: '100%' },
            { id: '15', name: 'Preußner, Pauline', role: 'Azubi', status: '100%' },
            { id: '16', name: 'Bielok, Lara', role: 'Pflegekraft', status: '100%' },
            { id: '17', name: 'Wüstkamp, Bianca', role: 'Pflegekraft', status: '100%' },
            { id: '18', name: 'Bondzau, Martina', role: 'Pflegekraft', status: '100%' }
        ];

        let SHIFT_TYPES = JSON.parse(localStorage.getItem('helios_shifts')) || {
            FD: { label: 'Frühdienst', color: 'bg-cyan-400', textColor: 'text-cyan-950', hours: 7.7 },
            SD: { label: 'Spätdienst', color: 'bg-fuchsia-500', textColor: 'text-white', hours: 7.7 },
            ZD: { label: 'Zwischendienst', color: 'bg-indigo-500', textColor: 'text-white', hours: 7.7 },
            ND: { label: 'Nachtdienst', color: 'bg-orange-600', textColor: 'text-white', hours: 9.5 },
            U:  { label: 'Urlaub', color: 'bg-yellow-400', textColor: 'text-yellow-950', hours: 7.7 },
            X:  { label: 'Frei', color: 'bg-white/10', textColor: 'text-slate-500', hours: 0 }
        };

        let EMPLOYEES = JSON.parse(localStorage.getItem('helios_employees')) || INITIAL_EMPLOYEES;
        let roster = JSON.parse(localStorage.getItem('helios_roster')) || {};
        let currentDate = new Date(2026, 3, 1);
        let activeShift = 'FD';
        let viewMode = 'month';
        let weekStartIndex = 0;

        // --- Firebase Core Logic ---
        async function initFirebase() {
            if (!window.firebaseCore) return;
            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, onAuthStateChanged } = window.firebaseCore;
            
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app); db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (u) => {
                    user = u;
                    if (user) {
                        document.getElementById('syncLabel').innerText = `Sync: Online`;
                        // Laden beim Start!
                        loadCloudData();
                    }
                });
            } catch (e) { showToast("DB-Fehler", "alert-circle"); }
        }

        async function loadCloudData() {
            if (!user || !db) return;
            const { doc, getDoc } = window.firebaseCore;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'rosterPlan', 'main');
            try {
                const snap = await getDoc(docRef);
                if (snap.exists()) {
                    const data = snap.data();
                    if (data.employees) EMPLOYEES = data.employees;
                    if (data.roster) roster = data.roster;
                    if (data.shifts) SHIFT_TYPES = data.shifts;
                    renderRoster();
                    showToast("Daten geladen", "cloud");
                }
            } catch (e) { showToast("Ladefehler", "alert-triangle"); }
        }

        async function saveData() {
            const saveIcon = document.getElementById('saveIcon');
            saveIcon.classList.add('animate-spin-fast');
            if (user && db) {
                const { doc, setDoc, serverTimestamp } = window.firebaseCore;
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'rosterPlan', 'main');
                try {
                    await setDoc(docRef, { employees: EMPLOYEES, roster: roster, shifts: SHIFT_TYPES, updatedAt: serverTimestamp() }, { merge: true });
                    showToast("Cloud gesichert", "cloud-check");
                } catch (e) { showToast("Fehler", "alert-triangle"); }
            }
            setTimeout(() => saveIcon.classList.remove('animate-spin-fast'), 800);
        }

        // --- View & Navigation ---
        function toggleViewMode(mode) { viewMode = mode; weekStartIndex = 0; updateViewButtons(); renderRoster(); }
        function updateViewButtons() {
            const mBtn = document.getElementById('viewMonthBtn');
            const wBtn = document.getElementById('viewWeekBtn');
            const active = "bg-blue-600 text-white shadow-lg";
            const inactive = "text-slate-500 hover:text-white";
            mBtn.className = viewMode === 'month' ? `px-3 py-1.5 rounded-lg text-[9px] font-black uppercase transition-all ${active}` : `px-3 py-1.5 rounded-lg text-[9px] font-black uppercase transition-all ${inactive}`;
            wBtn.className = viewMode === 'week' ? `px-3 py-1.5 rounded-lg text-[9px] font-black uppercase transition-all ${active}` : `px-3 py-1.5 rounded-lg text-[9px] font-black uppercase transition-all ${inactive}`;
        }
        function handleNavigation(dir) {
            if (viewMode === 'month') { currentDate.setMonth(currentDate.getMonth() + dir); }
            else { 
                const last = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
                weekStartIndex += dir * 7;
                if (weekStartIndex < 0) { currentDate.setMonth(currentDate.getMonth() - 1); weekStartIndex = 0; }
                else if (weekStartIndex >= last) { currentDate.setMonth(currentDate.getMonth() + 1); weekStartIndex = 0; }
            }
            renderRoster();
        }

        function exportToPDF() {
            const oldMode = viewMode; viewMode = 'month'; renderRoster();
            document.getElementById('printMonthLabel').innerText = currentDate.toLocaleString('de-DE', { month: 'long', year: 'numeric' });
            setTimeout(() => { window.print(); viewMode = oldMode; renderRoster(); }, 500);
        }

        // --- Core Rendering ---
        function renderRoster() {
            const year = currentDate.getFullYear(), month = currentDate.getMonth();
            const allDays = []; const d = new Date(year, month, 1);
            while (d.getMonth() === month) { allDays.push(new Date(d)); d.setDate(d.getDate() + 1); }
            const visibleDays = viewMode === 'month' ? allDays : allDays.slice(weekStartIndex, weekStartIndex + 7);
            
            document.getElementById('monthLabel').innerText = currentDate.toLocaleString('de-DE', { month: 'long', year: 'numeric' }) + (viewMode === 'week' ? ` | W${Math.floor(weekStartIndex/7)+1}` : '');

            let headHTML = `<tr><th class="p-3 text-left text-[10px] font-black sticky-left name-col-bg border-b border-black/10 min-w-[140px]">MITARBEITER</th><th class="p-2 border-b border-black/10 text-[10px] font-black">IST</th>`;
            visibleDays.forEach(day => {
                const isW = day.getDay() === 0 || day.getDay() === 6;
                headHTML += `<th class="p-2 border-b border-black/10 min-w-[40px] ${isW ? 'weekend-cell' : ''}">
                    <div class="flex flex-col items-center">
                        <span class="text-[8px] opacity-50 uppercase">${day.toLocaleDateString('de-DE', { weekday: 'short' })}</span>
                        <span class="text-xs font-black">${day.getDate()}</span>
                    </div>
                </th>`;
            });
            document.getElementById('tableHead').innerHTML = headHTML + `</tr>`;

            let bodyHTML = "";
            EMPLOYEES.forEach((emp, idx) => {
                let ist = 0; const eRost = roster[emp.id] || {};
                allDays.forEach(day => { const k = day.toISOString().split('T')[0]; if (eRost[k] && SHIFT_TYPES[eRost[k]]) ist += SHIFT_TYPES[eRost[k]].hours; });
                
                let dHTML = "";
                visibleDays.forEach(day => {
                    const k = day.toISOString().split('T')[0]; const s = eRost[k];
                    dHTML += `<td onclick="handleCellClick('${emp.id}', '${k}')" class="p-1 border-r border-black/5 text-center cursor-pointer">
                        <div class="h-8 w-full rounded flex items-center justify-center text-[10px] font-black ${s ? `${SHIFT_TYPES[s].color} ${SHIFT_TYPES[s].textColor}` : 'hover:bg-blue-500/5'}">${s || ''}</div>
                    </td>`;
                });

                bodyHTML += `<tr class="border-b border-black/5">
                    <td class="p-3 sticky-left name-col-bg font-bold text-[11px]">${emp.name}</td>
                    <td class="p-2 text-center text-[10px] font-black font-mono">${ist.toFixed(0)}</td>
                    ${dHTML}
                </tr>`;
            });
            document.getElementById('tableBody').innerHTML = bodyHTML;
            renderShiftPalette(); lucide.createIcons();
        }

        function handleCellClick(empId, dateKey) {
            if (!roster[empId]) roster[empId] = {};
            roster[empId][dateKey] = roster[empId][dateKey] === activeShift ? null : activeShift;
            renderRoster();
        }

        function renderShiftPalette() {
            const c = document.getElementById('shiftPalette'); c.innerHTML = "";
            Object.entries(SHIFT_TYPES).forEach(([k, v]) => {
                const b = document.createElement('button'); b.onclick = () => { activeShift = k; renderShiftPalette(); };
                b.className = `flex items-center gap-2 p-1.5 rounded-xl border transition-all ${activeShift===k?'bg-blue-500/20 border-blue-500 scale-105 shadow-lg':'bg-black/5 border-white/5'}`;
                b.innerHTML = `<div class="w-8 h-8 rounded-lg ${v.color} flex items-center justify-center font-black ${v.textColor}">${k}</div>`;
                c.appendChild(b);
            });
        }

        function adjustZoom(d) { const s = document.getElementById('zoomSlider'); let v = parseFloat(s.value); document.documentElement.style.setProperty('--zoom-factor', v); }
        function openColumnModal() { document.getElementById('columnOverlay').classList.remove('hidden'); document.getElementById('columnOverlay').classList.add('flex'); }
        function closeColumnModal() { document.getElementById('columnOverlay').classList.add('hidden'); }
        function showToast(m, i) { const t = document.getElementById('toast'); document.getElementById('toastMessage').innerText = m; t.classList.remove('hidden'); t.classList.add('flex'); setTimeout(() => { t.classList.add('hidden'); t.classList.remove('flex'); }, 3000); }

        window.onload = async function() {
            await initFirebase();
            renderRoster();
            updateViewButtons();
        };
    </script>
</body>
</html>
